name: MakeCode

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install -g pxt
      - run: pxt target microbit
      - run: pxt install
      # --cloud sends the C++ to the MakeCode compile service - no local
      # ARM toolchain needed, and it matches what the editor does
      - run: pxt build --cloud
